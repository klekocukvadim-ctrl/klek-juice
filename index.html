<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klek Джус — рідини 30 мл</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<script>
/* ===== НАЛАШТУВАННЯ МАГАЗИНУ ===== */
const config = { shopName: "Klek Джус", phone: "0973617204", phoneIntl: "+380973617204", currency: "грн" };
/* ===== ТОВАРИ: додавайте / змінюйте / видаляйте рядки =====

   tag: категорії через пробіл: fruit berry ice sour energy drink; line: LUX/Black/Mix/Beat */
const products = [
 {id:1, name:"Blueberry Mint", line:"LUX", volume:"30 мл", price:300, stock:8, image:"img/blueberry-mint.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-blueberry-mint-salt-50-mgml-30-ml", tag:"berry ice", color:["#3d5afe", "#00e5ff"]},
 {id:2, name:"Sour Apple", line:"LUX", volume:"30 мл", price:300, stock:7, image:"img/sour-apple.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-sour-apple-salt-50-mg-30-ml", tag:"fruit sour", color:["#76ff03", "#00c853"]},
 {id:3, name:"Energetic", line:"LUX", volume:"30 мл", price:300, stock:7, image:"img/energetic.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-energetic-salt-50-mgml-30-ml", tag:"energy drink", color:["#ffd600", "#ff6d00"]},
 {id:4, name:"Turbo Mint", line:"LUX", volume:"30 мл", price:300, stock:6, image:"img/turbo-mint.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-turbo-mint-salt-50-mgml-30-ml", tag:"ice", color:["#00e5ff", "#1de9b6"]},
 {id:5, name:"Coconut Melon", line:"LUX", volume:"30 мл", price:300, stock:5, image:"img/coconut-melon.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-coconut-melon-salt-50-mgml-30-ml", tag:"fruit", color:["#ffca28", "#8d6e63"]},
 {id:6, name:"Kiwi Passion Fruit Guava", line:"LUX", volume:"30 мл", price:300, stock:5, image:"img/kiwi-passion-fruit-guava.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-kiwi-passion-fruit-guava-salt-50-mgml-30-ml", tag:"fruit", color:["#64dd17", "#ff4081"]},
 {id:7, name:"Cherry Lemon", line:"LUX", volume:"30 мл", price:300, stock:5, image:"img/cherry-lemon.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-cherry-lemon-salt-50-mgml-30-ml", tag:"berry sour", color:["#ff1744", "#ffea00"]},
 {id:8, name:"Grape Mint", line:"LUX", volume:"30 мл", price:300, stock:4, image:"img/grape-mint.jpg", photoSource:"https://lulka.net/products/nabor-chaser-lux-grape-mint-salt-50-mgml-30-ml", tag:"fruit ice", color:["#aa00ff", "#1de9b6"]},
 {id:9, name:"Forest Mix", line:"Black", volume:"30 мл", price:300, stock:8, image:"img/forest-mix.jpg", photoSource:"https://lulka.net/products/nabor-chaser-salt-forest-mix-50-mgml-30-ml", tag:"berry", color:["#8e24aa", "#e53935"]},
 {id:10, name:"Blueberry Lemon", line:"Black", volume:"30 мл", price:300, stock:7, image:"img/blueberry-lemon.jpg", photoSource:"https://kalyan-city.com.ua/chaser-black-blueberry-lemon-30ml-50mg/", tag:"berry sour", color:["#3d5afe", "#ffee58"]},
 {id:11, name:"Energy Grape", line:"Black", volume:"30 мл", price:300, stock:6, image:"img/energy-grape.jpg", photoSource:"https://lulka.net/products/nabor-chaser-salt-energy-grape-50-mg-30-ml", tag:"energy fruit drink", color:["#aa00ff", "#00e676"]},
 {id:12, name:"Pink Lemonade", line:"Black", volume:"30 мл", price:300, stock:5, image:"img/pink-lemonade.jpg", photoSource:"https://kalyan-city.com.ua/chaser-black-pink-lemonade-30ml-50mg/", tag:"berry sour drink", color:["#ff4081", "#ffeb3b"]},
 {id:13, name:"Triple Berry", line:"Black", volume:"30 мл", price:300, stock:4, image:"img/triple-berry.jpg", photoSource:"https://lulka.net/products/nabor-chaser-salt-triple-berry-50-mgml-30-ml", tag:"berry", color:["#d50000", "#6a1b9a"]},
 {id:14, name:"Кола", line:"Mix", volume:"30 мл", price:300, stock:4, image:"img/cola.jpg", photoSource:"https://kalyan-city.com.ua/chaser-mix-cola-classic-30ml-65mg/", tag:"drink", color:["#6d2c00", "#ff3d00"]},
 {id:15, name:"Вишня кавун", line:"Mix", volume:"30 мл", price:300, stock:3, image:"img/cherry-watermelon.jpg", photoSource:"https://kalyan-city.com.ua/chaser-mix-cherry-watermelon-30ml-65mg/", tag:"berry fruit", color:["#d50000", "#00c853"]},
 {id:16, name:"Ківі груша", line:"Mix", volume:"30 мл", price:300, stock:3, image:"", photoSource:"", tag:"fruit", color:["#76ff03", "#cddc39"]},
 {id:17, name:"Полуниця виноград", line:"Mix", volume:"30 мл", price:300, stock:2, image:"img/strawberry-grape.jpg", photoSource:"https://kalyan-city.com.ua/chaser-mix-strawberry-grape-30ml-50mg/", tag:"berry fruit", color:["#ff1744", "#7c4dff"]},
 {id:18, name:"Лимонний йогурт", line:"Mix", volume:"30 мл", price:300, stock:2, image:"img/lemon-yogurt.jpg", photoSource:"https://kalyan-city.com.ua/chaser-mix-lemon-yogurt-30ml-65mg/", tag:"sour", color:["#ffee58", "#ff80ab"]},
 {id:19, name:"Watermelon Wave", line:"Beat", volume:"30 мл", price:300, stock:4, image:"img/watermelon-wave.jpg", photoSource:"https://lulka.net/products/chaser-beat-watermelon-wave-30-ml", tag:"fruit ice", color:["#ff1744", "#00e676"]},
 {id:20, name:"Blue Ice Beat", line:"Beat", volume:"30 мл", price:300, stock:3, image:"img/blue-ice-beat.jpg", photoSource:"https://lulka.net/products/chaser-beat-blue-ice-beat-30-ml", tag:"berry ice", color:["#2979ff", "#00e5ff"]},
 {id:21, name:"Arctic House", line:"Beat", volume:"30 мл", price:300, stock:3, image:"img/arctic-house.jpg", photoSource:"https://lulka.net/products/chaser-beat-arctic-house-30-ml", tag:"ice", color:["#00b0ff", "#18ffff"]}
];
const categories = {all:"Усі", fruit:"🍑 Фрукти", berry:"🫐 Ягоди", ice:"❄️ Холодок", sour:"🍋 Кислі", energy:"⚡ Енергетики", drink:"🥤 Напої"};
const lines = ["Усі","LUX","Black","Mix","Beat"];
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#7928ca;min-height:100%}
body{font-family:Rubik,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(135deg,#ff0080,#7928ca 45%,#00d4ff);background-attachment:scroll;background-repeat:no-repeat;background-size:100% 100%}
h1,h2,h3,.btn{font-family:Fredoka,Rubik,sans-serif}
header{text-align:center;padding:40px 16px 20px}
header h1{font-size:clamp(2.4rem,8vw,4.5rem);text-shadow:0 0 20px #ff00ea,0 4px 0 #3a0066;animation:pulse 2.5s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
header p{font-size:1.1rem;opacity:.95;margin-top:8px}
.call{display:inline-block;margin-top:16px}
.btn{border:0;cursor:pointer;border-radius:999px;padding:12px 22px;font-weight:700;font-size:1rem;text-decoration:none;color:#fff;background:linear-gradient(90deg,#ff00cc,#ffb300);box-shadow:0 6px 20px #0004;transition:.2s;display:inline-block}
.btn:hover{transform:translateY(-3px) scale(1.05)}
.btn.alt{background:linear-gradient(90deg,#00e5ff,#76ff03);color:#1a0033}
.tools{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#search{flex:1 1 100%;max-width:520px;padding:14px 20px;border-radius:999px;border:3px solid #fff;font-size:1rem;outline:none}
.chip{border:2px solid #fff;background:#ffffff22;color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-family:Fredoka,Rubik,sans-serif}
.chip.on{background:#fff;color:#c2006b}
.grid{max-width:1200px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{border-radius:30px;padding:20px;text-align:center;box-shadow:0 10px 30px #0005;transition:.3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 18px 40px #0007}
.card .pic{height:200px;display:flex;align-items:center;justify-content:center}
.card .pic svg{max-height:200px;max-width:100%;transition:.4s}
.card .pic img{width:100%;height:200px;object-fit:contain;background:#fff;border-radius:20px;padding:8px;transition:.4s;box-shadow:0 4px 14px #0003}
.card:hover .pic img{transform:scale(1.04)!important}
.line-tag{display:inline-block;background:#1a0033aa;border-radius:999px;padding:2px 10px;font-weight:700;margin-right:4px}
.badge.low{background:#ffea00;color:#c2006b}
#lineChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
#lineChips .chip.on{background:#1a0033;color:#ffea00;border-color:#ffea00}
.card:hover .pic svg,.card:hover .pic img{transform:rotate(8deg) scale(1.08)}
.card h3{font-size:1.5rem;text-shadow:0 2px 0 #0007,0 0 8px #0006;margin-top:8px}
.meta{opacity:.95;font-size:.9rem;text-shadow:0 1px 3px #0008}.price{text-shadow:0 2px 4px #0007;font-size:1.7rem;font-weight:700;font-family:Fredoka,Rubik,sans-serif;margin:8px 0}
.badge{position:absolute;top:14px;right:14px;background:#fff;color:#222;border-radius:999px;padding:4px 10px;font-size:.75rem;font-weight:700}
.card.out{filter:grayscale(.8)}.card.out .badge{background:#222;color:#fff}
.empty{text-align:center;font-size:1.2rem;grid-column:1/-1}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.box{background:linear-gradient(135deg,#7928ca,#ff0080);border-radius:30px;padding:30px;max-width:420px;text-align:center}
.box h2{font-size:2rem;margin-bottom:10px}.box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hidden{display:none!important}
footer{text-align:center;padding:30px 16px;background:#1a0033cc;margin-top:30px}
footer a{color:#76ff03}
</style></head><body>
<div id="age" class="modal hidden"><div class="box"><h2>🔞 Вам є 18?</h2><p>Сайт містить товари лише для повнолітніх.</p>
<div class="row"><button class="btn alt" id="yes">Мені є 18 років</button><button class="btn" id="no">Мені немає 18</button></div></div></div>
<div id="deny" class="modal hidden"><div class="box"><h2>Доступ закрито</h2><p>Вибачте, сайт доступний лише особам від 18 років.</p></div></div>
<div id="order" class="modal hidden"><div class="box"><h2 id="oTitle">Замовити</h2><p id="oText"></p>
<div class="row" id="oBtns"></div><div class="row"><button class="chip" id="oClose">Закрити</button></div></div></div>
<header><h1 id="shopName"></h1><p>Соковиті рідини 30 мл · обирай свій смак 💥</p>
<a class="btn alt call" id="callTop">📞 Подзвонити</a></header>
<div class="tools"><input id="search" placeholder="🔍 Пошук смаку..."><div id="chips" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"></div><div id="lineChips"></div></div>
<main class="grid" id="grid"></main>
<footer><p><b>⚠️ Товар призначений лише для осіб, яким виповнилося 18 років.</b></p>
<p style="margin-top:8px">Замовлення: <a id="footPhone"></a></p><p style="opacity:.7;margin-top:8px" id="copy"></p></footer>
<script>
const tel="tel:"+config.phoneIntl;
function bottleSVG(p){const [a,b]=p.color,id="g"+p.id;
return `<svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
<rect x="48" y="8" width="24" height="34" rx="6" fill="#222"/><rect x="42" y="38" width="36" height="16" rx="4" fill="#333"/>
<path d="M30 60 Q30 54 38 54 H82 Q90 54 90 60 V200 Q90 212 78 212 H42 Q30 212 30 200Z" fill="url(#${id})" stroke="#fff" stroke-width="3"/>
<rect x="36" y="100" width="48" height="70" rx="8" fill="#fff" opacity=".92"/>
<text x="60" y="125" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="9" font-weight="700" fill="${a}">${p.name.split(" ")[0]}</text>
<text x="60" y="138" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="8" fill="#333">${p.name.split(" ").slice(1).join(" ")}</text>
<text x="60" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#222">${p.volume}</text>
<rect x="36" y="64" width="8" height="120" rx="4" fill="#fff" opacity=".35"/></svg>`}
let cat="all",line="Усі";
function render(){const q=document.getElementById("search").value.toLowerCase().trim();
const list=products.filter(p=>(cat==="all"||p.tag.split(" ").includes(cat))&&(line==="Усі"||p.line===line)&&(p.name+' '+p.line).toLowerCase().includes(q));
document.getElementById("grid").innerHTML=list.length?list.map(p=>{const out=p.stock<=0;
return `<div class="card${out?" out":""}" style="background:linear-gradient(145deg,${p.color[0]},${p.color[1]})">
<span class="badge${!out&&p.stock<=3?" low":""}">${out?"Немає в наявності":p.stock<=3?"Залишилось "+p.stock+" шт":"В наявності: "+p.stock+" шт"}</span>
<div class="pic">${p.image?`<img src="${p.image}" alt="Chaser ${p.line} ${p.name}" onerror="this.outerHTML=bottleSVG(products.find(x=>x.id===${p.id}))">`:bottleSVG(p)}</div>
<h3>${p.name}</h3><div class="meta">${p.line?`<span class="line-tag">${p.line}</span>`:""}${p.volume}</div>
<div class="price">${p.price} ${config.currency}</div>
${out?`<button class="btn" disabled style="opacity:.6">Немає в наявності</button>`:`<button class="btn" onclick="order(${p.id})">🛒 Замовити</button>`}</div>`}).join(""):'<p class="empty">Нічого не знайдено 😔</p>'}
function order(id){const p=products.find(x=>x.id===id);const msg=`Хочу замовити: ${p.name} ${p.volume} — ${p.price} ${config.currency}`;
document.getElementById("oTitle").textContent=p.name;document.getElementById("oText").textContent=msg+". Оберіть спосіб зв'язку:";
document.getElementById("oBtns").innerHTML=`<a class="btn alt" href="${tel}">📞 Подзвонити</a>
<a class="btn" href="https://t.me/${config.phoneIntl}?text=${encodeURIComponent(msg)}" target="_blank">Telegram</a>
<a class="btn" style="background:linear-gradient(90deg,#7360f2,#b388ff)" href="viber://chat?number=${encodeURIComponent(config.phoneIntl)}&draft=${encodeURIComponent(msg)}">Viber</a>`;
document.getElementById("order").classList.remove("hidden")}
document.getElementById("oClose").onclick=()=>document.getElementById("order").classList.add("hidden");
document.getElementById("shopName").textContent=config.shopName;document.title=config.shopName+" — рідини 30 мл";
document.getElementById("callTop").href=tel;const fp=document.getElementById("footPhone");fp.href=tel;fp.textContent=config.phone;
document.getElementById("copy").textContent="© "+new Date().getFullYear()+" "+config.shopName;
document.getElementById("chips").innerHTML=Object.entries(categories).map(([k,v])=>`<button class="chip${k==="all"?" on":""}" data-c="${k}">${v}</button>`).join("");
document.getElementById("chips").onclick=e=>{const c=e.target.dataset.c;if(!c)return;cat=c;document.querySelectorAll(".chip[data-c]").forEach(b=>b.classList.toggle("on",b.dataset.c===c));render()};
document.getElementById("lineChips").innerHTML=lines.map(l=>`<button class="chip${l==="Усі"?" on":""}" data-l="${l}">${l==="Усі"?"Усі лінійки":l}</button>`).join("");
document.getElementById("lineChips").onclick=e=>{const l=e.target.dataset.l;if(!l)return;line=l;document.querySelectorAll(".chip[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===l));render()};
document.getElementById("search").oninput=render;
const age=localStorage.getItem("klek_age");
if(age==="yes"){}else if(age==="no"){document.getElementById("deny").classList.remove("hidden")}else document.getElementById("age").classList.remove("hidden");
document.getElementById("yes").onclick=()=>{localStorage.setItem("klek_age","yes");document.getElementById("age").classList.add("hidden")};
document.getElementById("no").onclick=()=>{localStorage.setItem("klek_age","no");document.getElementById("age").classList.add("hidden");document.getElementById("deny").classList.remove("hidden")};
render();
</script></body></html>
